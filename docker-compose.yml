name: evidsight

x-knowledge-environment: &knowledge-environment
  DEBUG: "true"
  ENV: development
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-evidsight-local}
  MYSQL_DATABASE: knowledge_db
  REDIS_URL: ${KNOWLEDGE_REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${KNOWLEDGE_CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${KNOWLEDGE_CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only}
  REFRESH_TOKEN_SECRET_KEY: ${REFRESH_TOKEN_SECRET_KEY:-local-development-only}
  # Refresh Cookie / CSRF 与严格 Origin 白名单（对齐 ADR-006 / CONFIGURATION.md §3.1）
  EVIDSIGHT_PLATFORM_REFRESH_COOKIE_NAME: ${EVIDSIGHT_PLATFORM_REFRESH_COOKIE_NAME:-__Host-evidsight_refresh}
  EVIDSIGHT_PLATFORM_REFRESH_COOKIE_PATH: ${EVIDSIGHT_PLATFORM_REFRESH_COOKIE_PATH:-/}
  EVIDSIGHT_PLATFORM_REFRESH_COOKIE_SECURE: ${EVIDSIGHT_PLATFORM_REFRESH_COOKIE_SECURE:-true}
  EVIDSIGHT_PLATFORM_REFRESH_COOKIE_SAMESITE: ${EVIDSIGHT_PLATFORM_REFRESH_COOKIE_SAMESITE:-lax}
  EVIDSIGHT_PLATFORM_CSRF_COOKIE_NAME: ${EVIDSIGHT_PLATFORM_CSRF_COOKIE_NAME:-evidsight_csrf}
  EVIDSIGHT_PLATFORM_AUTH_ALLOWED_ORIGINS: ${EVIDSIGHT_PLATFORM_AUTH_ALLOWED_ORIGINS:-}
  EVIDSIGHT_PLATFORM_AUTH_BODY_REFRESH_COMPAT: ${EVIDSIGHT_PLATFORM_AUTH_BODY_REFRESH_COMPAT:-false}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
  LLM_FLASH_MODEL: ${LLM_FLASH_MODEL:-deepseek-v4-flash}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
  RERANK_BASE_URL: ${RERANK_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
  RERANK_API_KEY: ${RERANK_API_KEY:-}
  RERANK_MODEL: ${RERANK_MODEL:-qwen3-rerank}
  CLEAN_ENABLED: ${CLEAN_ENABLED:-true}
  CLEAN_STRIP_BOILERPLATE: ${CLEAN_STRIP_BOILERPLATE:-true}
  CLEAN_NORMALIZE_WHITESPACE: ${CLEAN_NORMALIZE_WHITESPACE:-true}
  CLEAN_REPAIR_UNICODE: ${CLEAN_REPAIR_UNICODE:-true}
  CHROMA_PERSIST_DIR: /data/chroma
  UPLOAD_DIR: /data/uploads

x-research-environment: &research-environment
  DEBUG: "true"
  ENV: development
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-evidsight-local}
  MYSQL_DATABASE: research_db
  REDIS_URL: ${RESEARCH_REDIS_URL:-redis://redis:6379/3}
  CELERY_BROKER_URL: ${RESEARCH_CELERY_BROKER_URL:-redis://redis:6379/4}
  CELERY_RESULT_BACKEND: ${RESEARCH_CELERY_RESULT_BACKEND:-redis://redis:6379/5}
  CELERY_EXECUTE_QUEUE: research.execute
  CELERY_PERIODIC_QUEUE: research.periodic
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only}
  REFRESH_TOKEN_SECRET_KEY: ${REFRESH_TOKEN_SECRET_KEY:-local-development-only}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro}
  LLM_FLASH_MODEL: ${LLM_FLASH_MODEL:-mimo-v2.5}
  TAVILY_BASE_URL: ${TAVILY_BASE_URL:-https://api.tavily.com}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

x-knowledge-service: &knowledge-service
  build:
    context: ./services/knowledge
    dockerfile: Dockerfile
  environment: *knowledge-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  restart: unless-stopped

x-research-service: &research-service
  build:
    context: ./services/research
    dockerfile: Dockerfile
  environment: *research-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      knowledge-api:
        condition: service_healthy
      research-api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

  knowledge-api:
    <<: *knowledge-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes:
      - evidsight_knowledge_uploads:/data/uploads
      - evidsight_knowledge_chroma:/data/chroma
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, internal]

  knowledge-worker:
    <<: *knowledge-service
    command: ["celery", "-A", "app.ingest.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "knowledge.ingest,knowledge.delete"]
    volumes:
      - evidsight_knowledge_uploads:/data/uploads
      - evidsight_knowledge_chroma:/data/chroma

  research-api:
    <<: *research-service
    command: ["web"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, internal]

  research-worker:
    <<: *research-service
    entrypoint: []
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "research.execute,research.periodic"]

  research-beat:
    <<: *research-service
    command: ["beat"]
    volumes:
      - evidsight_research_beat:/var/lib/celery

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-evidsight-local}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - evidsight_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - evidsight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

networks:
  edge:
    name: evidsight-edge
  internal:
    name: evidsight-internal

volumes:
  evidsight_mysql_data:
  evidsight_redis_data:
  evidsight_knowledge_uploads:
  evidsight_knowledge_chroma:
  evidsight_research_beat:
