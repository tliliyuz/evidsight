name: evidsight

x-knowledge-environment: &knowledge-environment
  DEBUG: "true"
  ENV: development
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-evidsight-local}
  MYSQL_DATABASE: knowledge_db
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only}
  REFRESH_TOKEN_SECRET_KEY: ${REFRESH_TOKEN_SECRET_KEY:-local-development-only}
  LLM_API_KEY: ${LLM_API_KEY:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  RERANK_API_KEY: ${RERANK_API_KEY:-}
  CHROMA_PERSIST_DIR: /data/chroma
  UPLOAD_DIR: /data/uploads

x-research-environment: &research-environment
  DEBUG: "true"
  ENV: development
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-evidsight-local}
  MYSQL_DATABASE: research_db
  REDIS_URL: redis://redis:6379/3
  CELERY_BROKER_URL: redis://redis:6379/4
  CELERY_RESULT_BACKEND: redis://redis:6379/5
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only}
  REFRESH_TOKEN_SECRET_KEY: ${REFRESH_TOKEN_SECRET_KEY:-local-development-only}
  LLM_API_KEY: ${LLM_API_KEY:-}
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}

x-knowledge-service: &knowledge-service
  build:
    context: ./services/knowledge
    dockerfile: Dockerfile
  environment: *knowledge-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  restart: unless-stopped

x-research-service: &research-service
  build:
    context: ./services/research
    dockerfile: Dockerfile
  environment: *research-environment
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [internal]
  restart: unless-stopped

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      knowledge-api:
        condition: service_healthy
      research-api:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped

  knowledge-api:
    <<: *knowledge-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    volumes:
      - evidsight_knowledge_uploads:/data/uploads
      - evidsight_knowledge_chroma:/data/chroma
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, internal]

  knowledge-worker:
    <<: *knowledge-service
    command: ["celery", "-A", "app.ingest.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "knowledge.ingest,knowledge.delete"]
    volumes:
      - evidsight_knowledge_uploads:/data/uploads
      - evidsight_knowledge_chroma:/data/chroma

  research-api:
    <<: *research-service
    command: ["web"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [edge, internal]

  research-worker:
    <<: *research-service
    entrypoint: []
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "research.execute,research.recovery,research.periodic"]

  research-beat:
    <<: *research-service
    command: ["beat"]
    volumes:
      - evidsight_research_beat:/var/lib/celery

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-evidsight-local}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    volumes:
      - evidsight_mysql_data:/var/lib/mysql
      - ./deploy/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [internal]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - evidsight_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]
    restart: unless-stopped

networks:
  edge:
    name: evidsight-edge
  internal:
    name: evidsight-internal

volumes:
  evidsight_mysql_data:
  evidsight_redis_data:
  evidsight_knowledge_uploads:
  evidsight_knowledge_chroma:
  evidsight_research_beat:
