    # ---- Conversation ----
    ConversationCreateV1:
      type: object
      description: 创建会话请求（v1，knowledge_base_id 对齐 Chat v1）
      required: [knowledge_base_id]
      properties:
        knowledge_base_id:
          type: string
          format: uuid
          description: 关联知识库稳定 UUID
        title:
          type: string
          maxLength: 256
          nullable: true
          description: 会话标题，不传则默认「新对话」
    ConversationUpdate:
      type: object
      description: 重命名会话请求
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 256
    Message:
      type: object
      description: 会话消息
      required: [id, role, content, created_at]
      properties:
        id:
          type: integer
          description: 消息内部整数 ID
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        thinking_content:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Conversation:
      type: object
      required: [uuid, owner_user_id, title, message_count, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
          description: owner 用户 Platform User UUID（非内部 users.id）
        kb_uuid:
          type: string
          format: uuid
          nullable: true
          description: 关联知识库 UUID（KB 删除后为 null）
        kb_status:
          type: string
          enum: [active, deleted, unavailable]
          nullable: true
        kb_name:
          type: string
          nullable: true
          description: 关联知识库名称（含已删除/不可访问的）
        original_kb_uuid:
          type: string
          format: uuid
          nullable: true
          description: KB 删除前的原始 UUID
        original_kb_name:
          type: string
          nullable: true
          description: KB 删除前的原始名称
        title:
          type: string
        message_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          nullable: true
    ConversationDetail:
      type: object
      description: 会话详情（含消息历史）
      required:
        [uuid, owner_user_id, title, message_count, created_at, updated_at, messages]
      properties:
        uuid:
          type: string
          format: uuid
        owner_user_id:
          type: string
          format: uuid
        kb_uuid:
          type: string
          format: uuid
          nullable: true
        kb_status:
          type: string
          enum: [active, deleted, unavailable]
          nullable: true
        kb_name:
          type: string
          nullable: true
        original_kb_uuid:
          type: string
          format: uuid
          nullable: true
        original_kb_name:
          type: string
          nullable: true
        title:
          type: string
        message_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_message_at:
          type: string
          format: date-time
          nullable: true
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
    ConversationList:
      type: object
      required: [total, page, page_size, items]
      properties:
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"
    ConversationEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          const: "0"
        message:
          type: string
        data:
          $ref: "#/components/schemas/Conversation"
    ConversationDetailEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          const: "0"
        message:
          type: string
        data:
          $ref: "#/components/schemas/ConversationDetail"
    ConversationListEnvelope:
      type: object
      required: [code, message, data]
      properties:
        code:
          type: string
          const: "0"
        message:
          type: string
        data:
          $ref: "#/components/schemas/ConversationList"
