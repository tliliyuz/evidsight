[project]
name = "evidsight"
version = "0.1.0"
description = "Evidence-driven enterprise knowledge and deep research platform"
readme = "README.md"
authors = [
    { name = "yyuer", email = "1654091169@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
evidsight = "evidsight:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# 迁移脚本、评估 fixture、生成物与第三方样例保留既有长行，不纳入格式化
exclude = [
    "services/*/alembic/versions/*.py",
    "**/chroma_data",
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.pytest_cache",
]

# 独立脚本/评估/回归入口通过 sys.path 自举后再导入 app 包，E402 为刻意模式
[tool.ruff.lint.per-file-ignores]
"services/knowledge/scripts/migrate_to_per_kb_collections.py" = ["E402"]
"services/knowledge/tests/eval/*.py" = ["E402"]
"services/knowledge/tests/regression/*.py" = ["E402"]

[tool.ruff.format]
exclude = [
    "services/*/alembic/versions/*.py",
    "**/chroma_data",
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.pytest_cache",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/packages/contracts/generated/python"]
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = [
    "services/.*/alembic/versions/",
    ".*/node_modules/",
    '.*/\.venv/',
]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "fitz",
    "jieba",
    "locust",
    "locust.*",
    "ragas",
    "ragas.*",
    "rank_bm25",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
