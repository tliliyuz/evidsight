[project]
name = "evidsight"
version = "0.1.0"
description = "Evidence-driven enterprise knowledge and deep research platform"
readme = "README.md"
authors = [
    { name = "yyuer", email = "1654091169@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.34.2",
]

[project.scripts]
evidsight = "evidsight:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# 迁移脚本、评估 fixture、生成物与第三方样例保留既有长行，不纳入格式化
exclude = [
    "services/*/alembic/versions/*.py",
    "**/chroma_data",
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.pytest_cache",
]

[tool.ruff.format]
exclude = [
    "services/*/alembic/versions/*.py",
    "**/chroma_data",
    "**/.venv",
    "**/node_modules",
    "**/__pycache__",
    "**/.pytest_cache",
]
