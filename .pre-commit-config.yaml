# 提交前静态门禁：只报告、不修改文件；基线告警按「触碰即清理」原则增量消解。
# ruff 版本随根 uv.lock（pre-commit 使用 repo: local 不重复固定版本）。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        files: ^(services|scripts|tests|packages/contracts)/.*\.py$
        exclude: ^services/[^/]+/alembic/versions/.*\.py$
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: .venv/bin/ruff format --check
        language: system
        files: ^(services|scripts|tests|packages/contracts)/.*\.py$
        exclude: ^services/[^/]+/alembic/versions/.*\.py$
        stages: [pre-commit]
      - id: python-mypy
        name: python mypy (全量范围)
        entry: bash scripts/check_python_types.sh
        language: system
        files: ^(services/(knowledge|research)/(app/.*|scripts/(?!\.ab/).*|tests/.*|alembic/env)|packages/contracts/(generated/python|tests)/.*|tests/.*)\.py$
        pass_filenames: false
        stages: [pre-commit]
      - id: web-eslint
        name: web eslint
        entry: pnpm --dir apps/web run lint
        language: system
        files: ^apps/web/.*\.[cm]?[jt]sx?$
        pass_filenames: false
        stages: [pre-commit]
      - id: web-prettier
        name: web prettier --check
        entry: pnpm --dir apps/web run format:check
        language: system
        files: ^apps/web/
        pass_filenames: false
        stages: [pre-commit]
      - id: web-design-gates
        name: web design token and prototype baselines
        entry: pnpm --dir apps/web run check:design
        language: system
        files: ^(apps/web/|resource/prototype/|docs/(specs/TESTING|guides/DEVELOPMENT|plans/ROADMAP)\.md$)
        pass_filenames: false
        stages: [pre-commit]
      - id: commit-msg-lint
        name: commit message format
        entry: bash scripts/check_commit_msg.sh
        language: system
        stages: [commit-msg]
