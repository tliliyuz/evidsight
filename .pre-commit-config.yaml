# 提交前静态门禁：只报告、不修改文件；基线告警按「触碰即清理」原则增量消解。
# ruff 版本随根 uv.lock（pre-commit 使用 repo: local 不重复固定版本）。
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        files: ^(services|scripts|tests|packages/contracts)/.*\.py$
        exclude: ^services/[^/]+/alembic/versions/.*\.py$
        stages: [pre-commit]
      - id: ruff-format
        name: ruff format --check
        entry: .venv/bin/ruff format --check
        language: system
        files: ^(services|scripts|tests|packages/contracts)/.*\.py$
        exclude: ^services/[^/]+/alembic/versions/.*\.py$
        stages: [pre-commit]
      - id: python-mypy
        name: python mypy (当前范围)
        entry: bash scripts/check_python_types.sh
        language: system
        files: ^services/(knowledge/app/((api|middleware|schemas)/.*\.py|(config|dependencies)\.py|core/(permissions|csrf|exceptions|security|service_security|sse|utils)\.py)|research/app/((api|middleware|schemas)/.*\.py|(config|dependencies)\.py|core/(permissions|utils|exceptions|security|service_security|sse|task_state_resolver|token_counter)\.py))$
        pass_filenames: false
        stages: [pre-commit]
      - id: web-eslint
        name: web eslint
        entry: pnpm --dir apps/web run lint
        language: system
        files: ^apps/web/.*\.[cm]?[jt]sx?$
        pass_filenames: false
        stages: [pre-commit]
      - id: web-prettier
        name: web prettier --check
        entry: pnpm --dir apps/web run format:check
        language: system
        files: ^apps/web/
        pass_filenames: false
        stages: [pre-commit]
      - id: commit-msg-lint
        name: commit message format
        entry: bash scripts/check_commit_msg.sh
        language: system
        stages: [commit-msg]
